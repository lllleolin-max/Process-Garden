name: Release Windows and macOS installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            artifact: windows-x64
          - name: macOS Universal
            runner: macos-latest
            target: universal-apple-darwin
            bundles: app,dmg
            artifact: macos-universal
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.artifact }}
          cache-on-failure: true
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib --locked
      - name: Build installers
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Check Windows startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "src-tauri/target/x86_64-pc-windows-msvc/release/process-garden.exe" -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 15
            if ($app.HasExited) { throw "Application exited during startup: $($app.ExitCode)" }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id }
          }
      - name: Check macOS bundle and startup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Process Garden.app"
          lipo "$APP/Contents/MacOS/process-garden" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$APP"
          hdiutil verify src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          "$APP/Contents/MacOS/process-garden" > /tmp/process-garden-smoke.log 2>&1 &
          APP_PID=$!
          sleep 15
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            cat /tmp/process-garden-smoke.log
            exit 1
          fi
          kill "$APP_PID"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.artifact }}
          if-no-files-found: error
          compression-level: 0
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg

  draft:
    name: Assemble release draft
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: artifacts
          merge-multiple: true
      - name: Collect installers and checksums
        shell: bash
        run: |
          mkdir release-assets
          find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) -exec cp {} release-assets/ \;
          test "$(find release-assets -type f | wc -l)" -eq 3
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release-assets/* --verify-tag --draft --title "Process Garden ${{ github.ref_name }}" --notes-file release/RELEASE-NOTES.md
